name: alpaca-bars
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: alpaca-bars
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch 1-minute option bars
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          BUDGET: '2700'
        run: |
          mkdir -p requests && cp -n bars_request.json requests/ || true
          python alpaca_bars.py
      - name: commit
        run: |
          git config user.name 'alpaca-bars bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/intraday data/stocks
          git diff --cached --quiet && echo 'nothing new' && exit 0
          git commit -m "alpaca bars: $(ls data/intraday | wc -l) contracts"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 20; done
